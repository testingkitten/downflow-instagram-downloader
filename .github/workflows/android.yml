name: Android companion

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee ../android-build.log

      - name: Upload build log when compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: download-images-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
